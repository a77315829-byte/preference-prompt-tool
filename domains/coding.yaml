# TypeScript/React 코딩 스타일 개인화 도메인

domain: coding

task_description: >-
  아래 개발 요청을 해결하는 TypeScript/React 코드를 작성하라.
  사용자가 선호하는 코드 구성, 스타일 관리, 타입 작성 방식을
  일관되게 적용하라.

checks_module: checks.coding

axes:
  - name: code_structure
    type: enum
    description: 코드와 관련 로직을 나누는 방식

    values:
      - value: compact
        prompt: >-
          작은 기능은 한 파일 안에 컴포넌트, 상태 로직, 스타일을
          함께 두어 간결하게 작성하라.
        check:
          fn: file_structure
          target:
            max_files: 1

      - value: separated
        prompt: >-
          컴포넌트, 상태 로직, 스타일을 역할별 파일로 분리하고
          각 파일의 이름과 코드를 명확히 구분해 제시하라.
        check:
          fn: file_structure
          target:
            min_files: 2

  - name: style_management
    type: enum
    description: 색상, 간격, 글꼴 같은 디자인 값을 관리하는 방식

    values:
      - value: direct
        prompt: >-
          색상, 간격, 크기 같은 스타일 값은 스타일 파일이나
          컴포넌트에 직접 작성하여 바로 확인할 수 있게 하라.
        check:
          fn: theme_usage
          target:
            max_theme_signals: 0

      - value: theme
        prompt: >-
          색상, 간격, 글꼴 같은 디자인 값은 theme 또는
          디자인 토큰으로 모아서 관리하라. 컴포넌트에서는
          해당 값을 참조하여 전체 디자인을 쉽게 수정할 수 있게 하라.
        check:
          fn: theme_usage
          target:
            min_theme_signals: 2
  - name: type_detail
    type: enum
    description: TypeScript 타입을 명시하는 정도

    values:
      - value: inferred
        prompt: >-
          TypeScript가 분명하게 추론할 수 있는 지역 변수와
          단순한 반환값에는 타입을 반복해서 작성하지 마라.
          꼭 필요한 공개 경계에만 타입을 작성하라.
        check:
          fn: type_explicitness
          target:
            max_signals: 3

      - value: explicit
        prompt: >-
          Props, 함수 매개변수, 반환값, 상태와 주요 데이터 구조의
          타입을 꼼꼼하게 명시하라.
        check:
          fn: type_explicitness
          target:
            min_signals: 5

# 만든 프롬프트를 내보낼 곳 (exporters.py). 코딩 도구는 저장소 안의 파일을
# 자동으로 읽으므로 채팅 서비스 복사에 더해 저장소용 파일을 준다.
export_targets: [copilot, cursor, agents_md, chatgpt, claude, gemini]

# 사용자에게 건네는 최종 프롬프트의 틀 (engine/generator.py 의
# build_final_prompt). 후보를 만들 때 쓰는 문구와는 따로 둔다.
final_prompt:
  role: 당신은 이 사용자의 코딩 취향에 맞춰 TypeScript/React 코드를 작성하는 페어 프로그래머다. 아래 선호는 사용자가 여러 코드 예시를 직접 비교하며 고른 결과에서 추정한 것이다.
  preference_heading: 이 사용자의 선호
  # 팀 모드(여러 사람의 선택을 합친 프롬프트)에서 쓰는 문구.
  team_role: 당신은 이 팀의 코딩 취향에 맞춰 TypeScript/React 코드를 작성하는 페어 프로그래머다. 아래 선호는 팀원들이 각자 여러 코드 예시를 직접 비교하며 고른 결과를 합쳐 추정한 것이다.
  team_preference_heading: 이 팀의 선호
  rules_heading: 항상 지킬 것
  output_heading: 출력 형식
  rules:
  - 그대로 붙여 넣어 실행할 수 있는 완성된 코드를 작성하라. 생략 표시(...)로 건너뛰지 마라.
  - 요청에 없는 라이브러리를 새로 들이지 마라. 꼭 필요하면 이유를 한 줄로 밝혀라.
  - 선호한 구조와 스타일을 예시 전체에 일관되게 적용하라.
  - 접근성(레이블, 키보드 조작)을 기본으로 챙겨라.
  output: 코드를 먼저 보여 주고, 그 방식을 고른 이유를 두세 문장으로 덧붙여라.
  axis_labels:
    code_structure: 코드 구성
    style_management: 스타일 관리
    type_detail: 타입 작성

# 최적화 평가용 예시 입력 (새로 쓴 가상의 내용). 최적화가 사용자 원문
# 하나에 맞춰 그 내용을 프롬프트에 박아 넣지 않도록, 후보를 고를 때
# 이 입력들로 채점한다.
example_sources:
- A search input that filters a list of product names as the user types.
- A modal dialog component with a title, body text, and confirm and cancel buttons.
- A hook that fetches a user's profile from an API and exposes loading and error states.
