# domains/summarization.yaml 에서 파생. length/extractiveness/topic 축은
# 그대로 상속하고, specificity 축 하나만 추가한다 (CLAUDE.md v2, 우선순위 3).
#
# 6주차에 코드(정규식/spaCy)로 판별 못 해 제외했던 축을, 하이브리드 판정
# 계층(checks/summarization_hybrid.py - 학습형 분류기 -> 소형 LLM -> 대형
# LLM)으로 복원한다. checks_module만 바꾸고 나머지 축의 정의는 베이스와
# 100% 동일하게 유지된다(extends로 상속하므로 손으로 다시 안 씀).
#
# 기본 파이프라인(summarization.yaml)은 이 파일과 무관하게 무료·즉시로
# 그대로 남는다 - GEPA 실험은 명시적으로 이 YAML을 골랐을 때만 specificity
# 판정에 실제 API 비용이 든다.

extends: summarization.yaml
domain: summarization_hybrid
checks_module: checks.summarization_hybrid

axes:
  - name: specificity
    type: enum
    description: 숫자·고유명사 등 구체적 정보의 밀도 (하이브리드 LLM 판정)
    values:
      - value: normal
        prompt: 일반적인 수준의 구체성으로 요약하라. 세부 수치나 고유명사 나열에 치우치지 마라.
        check:
          fn: specificity_judge
          target: {}
      - value: high
        prompt: 숫자, 날짜, 고유명사 등 구체적인 정보를 최대한 포함해 요약하라.
        check:
          fn: specificity_judge
          target: {}

# 영어 결과 프롬프트에는 추가 축의 지시문도 필요하다. 부모 파일의 번역판은
# 축 목록과 달리 자동 병합되지 않으므로, 기존 문구를 유지하며 이 축만 보탠다.
final_prompt_translations:
  en:
    role: "You are a summarization assistant who summarizes English text to match this user's preferences."
    preference_note: "The preferences below were inferred from summaries the user picked while comparing several options."
    team_role: "You are a summarization assistant who summarizes English text to match this team's preferences."
    team_preference_note: "The preferences below were inferred by combining the summaries each team member picked while comparing several options."
    task: "Summarize the source text below according to these instructions. Always write the summary in English, the same language as the source."
    preference_heading: "This user's preferences"
    team_preference_heading: "This team's preferences"
    rules_heading: "Always"
    rules:
      - "Follow the preferences above (length, use of source wording) first; apply the rules below within them."
      - "Do not add facts, guesses, or opinions that are not in the source."
      - "Do not misstate numbers, dates, or proper nouns."
      - "Keep confirmed facts separate from things that are under review or uncertain."
    output_heading: "Output format"
    output: "Output only the summary, in English. No preamble, title, explanation, or closing."
    axis_labels:
      length: "Length"
      extractiveness: "Use of source wording"
      topic: "Focus"
      specificity: "Detail level"
    instructions:
      length:
        short: "Keep it very short: two sentences or fewer."
        normal: "Write about three to four sentences."
        long: "Write five or more sentences, in detail."
      extractiveness:
        normal: "Mostly rephrase in your own words; quote the source wording only where it helps."
        high: "Reuse the source's words and phrases as much as possible."
        fully: "Build the summary from sentences extracted verbatim from the source. Do not write new sentences."
      specificity:
        normal: "Summarize at a general level without overloading the answer with figures or proper nouns."
        high: "Include specific information such as numbers, dates, and proper nouns where relevant."
    freeform_templates:
      topic: 'Focus the summary on "{value}". You may leave out other parts of the source.'
