# 확장성 검증용 더미 도메인 (11주차). 이메일 초안, 축 3개.
# 목적은 engine/ 코드를 한 줄도 안 고치고 이 YAML만 추가해서 새 도메인이
# 동작하는지 증명하는 것 - summarization.yaml과 완전히 별개 도메인이다.

domain: email
task_description: >-
  아래 요청 사항에 맞는 이메일 본문을 작성하라. 이메일은 반드시
  영어(English)로 작성하라.

checks_module: checks.email

axes:
  - name: length
    type: enum
    description: 이메일 길이
    values:
      - value: short
        prompt: 2문장 이내로 아주 짧게 작성하라.
        check:
          fn: sentence_count
          target: { max_sentences: 2 }
      - value: normal
        prompt: 3~5문장 정도의 분량으로 작성하라.
        check:
          fn: sentence_count
          target: { min_sentences: 3, max_sentences: 5 }
      - value: long
        prompt: 6문장 이상으로 상세하게 작성하라.
        check:
          fn: sentence_count
          target: { min_sentences: 6 }

  - name: formality
    type: enum
    description: 격식 수준 (축약형 사용 여부로 측정)
    values:
      - value: casual
        prompt: 편하고 친근한 어조로, 축약형(I'm, don't, we'll 등)을 자유롭게 써라.
        check:
          fn: contraction_ratio
          target: { min_ratio: 0.3 }
      - value: formal
        prompt: 격식 있는 비즈니스 어조로 작성하라. 축약형을 쓰지 마라 (I am, do not, we will 등으로 풀어써라).
        check:
          fn: contraction_ratio
          target: { max_ratio: 0.1 }

  - name: structure
    type: enum
    description: 본문 구조 (글머리 기호 사용 여부)
    values:
      - value: prose
        prompt: 글머리 기호나 목록 없이, 완전한 문단 형태의 산문으로 작성하라.
        check:
          fn: bullet_ratio
          target: { max_ratio: 0.0 }
      - value: bullets
        prompt: 핵심 내용을 글머리 기호(-, *, 숫자 등) 목록으로 정리해 작성하라.
        check:
          fn: bullet_ratio
          target: { min_ratio: 0.2 }

# 사용자에게 건네는 최종 프롬프트의 틀 (engine/generator.py 의
# build_final_prompt). 후보를 만들 때 쓰는 문구와는 따로 둔다.
final_prompt:
  role: 당신은 이 사용자를 대신해 업무 이메일 초안을 쓰는 작성 도우미다. 아래 선호는 사용자가 여러 초안을 직접 비교하며 고른 결과에서 추정한 것이다.
  preference_heading: 이 사용자의 선호
  # 팀 모드(여러 사람의 선택을 합친 프롬프트)에서 쓰는 문구.
  team_role: 당신은 이 팀을 대신해 업무 이메일 초안을 쓰는 작성 도우미다. 아래 선호는 팀원들이 각자 여러 초안을 직접 비교하며 고른 결과를 합쳐 추정한 것이다.
  team_preference_heading: 이 팀의 선호
  rules_heading: 항상 지킬 것
  output_heading: 출력 형식
  rules:
  - 요청 사항에 있는 내용만 쓰고, 날짜·시간·금액을 지어내지 마라. 필요한데 없으면 [대괄호]로 자리만 남겨라.
  - 받는 사람이 해야 할 일이 있으면 무엇을 언제까지 해야 하는지 분명히 적어라.
  - 첫 문장에서 이메일의 목적을 밝혀라.
  - 정중함을 유지하되 불필요한 사과나 군더더기 인사를 늘어놓지 마라.
  output: 이메일 본문만 영어로 출력하라. 제목 줄이나 초안에 대한 설명을 붙이지 마라.
  axis_labels:
    length: 분량
    formality: 격식
    structure: 본문 구조

# 최적화 평가용 예시 입력 (새로 쓴 가상의 내용). 최적화가 사용자 원문
# 하나에 맞춰 그 내용을 프롬프트에 박아 넣지 않도록, 후보를 고를 때
# 이 입력들로 채점한다.
example_sources:
- Ask the facilities team to fix the broken air conditioning in meeting room 4 before Thursday's client visit.
- Tell a job candidate that the second interview is moved from Monday to Wednesday at 3 pm, and ask them to confirm.
- Remind the team that expense reports for September are due Friday and point them to the new submission form.
