# 도메인: 문서 요약 (MACSum 기반)
# engine/ 은 이 파일을 통해서만 축 이름·값·프롬프트 문구·검사 함수를 안다.
# 여기 적힌 값은 data/macsum 의 control_attribute 실측값과 정확히 일치해야
# experiments/persona.py 가 MACSum 정답 요약을 답안지로 매칭할 수 있다.
#
# length/extractiveness의 target 수치는 MACSum train+val 실측 분포(6주차,
# checks/summarization.py 작성 시 분석)에 맞춰 보정했다.
#
# specificity 축은 제외했다: 정규식 휴리스틱은 물론 spaCy NER로 측정해도
# normal(0.217)과 high(0.228) 사이에 실질적 차이가 없었다 (val split,
# 숫자·고유명사류 엔티티 토큰 밀도 기준). MACSum의 specificity 라벨은
# 표면적 수치·고유명사 밀도가 아닌 다른 성질(질적 서술 정밀도로 추정)을
# 반영하는 것으로 보이며, 100% topic 축과 동반 출현해 독립 축으로도 보기
# 어렵다. 코드로 재현 가능하게 잴 수 없는 축은 넣지 않는다 (절대 규칙 6).
#
# 8주차 점검에서 발견: task_description이 한국어라 출력 언어가 축조합에
# 따라 들쭉날쭉했다 (extractiveness=fully일 땐 원문을 그대로 베껴 영어로,
# 그 외엔 한국어로). MACSum 원문·정답 요약이 전부 영어라 lexical_overlap/
# keyword_presence/persona.choose가 전부 언어 불일치로 왜곡됐다. 출력
# 언어를 영어로 명시 고정한다.

domain: summarization
task_description: >-
  아래 원문을 지침에 따라 요약하라. 요약은 반드시 영어(English)로
  작성하라 - 다른 지침이 한국어로 적혀 있어도 원문과 같은 언어인 영어로
  답하라.

checks_module: checks.summarization

axes:
  - name: length
    type: enum
    description: 요약 길이
    values:
      - value: short
        prompt: 2문장 이내로 아주 짧게 요약하라.
        check:
          fn: sentence_count
          target: { max_sentences: 2 }
      - value: normal
        prompt: 3~4문장 정도의 분량으로 요약하라.
        check:
          fn: sentence_count
          target: { min_sentences: 3, max_sentences: 4 }
      - value: long
        prompt: 5문장 이상으로 상세하게 요약하라.
        check:
          fn: sentence_count
          target: { min_sentences: 5 }

  - name: extractiveness
    type: enum
    description: 원문 표현을 그대로 가져오는 정도 (원문과의 연속 2단어 겹침 비율로 측정)
    values:
      - value: normal
        prompt: 대부분은 새로운 표현으로 바꿔 쓰되, 필요하면 원문 표현을 일부 인용해도 좋다.
        check:
          fn: lexical_overlap
          target: { max_overlap: 0.5 }
      - value: high
        prompt: 가능한 한 원문의 단어와 구절을 그대로 사용해 요약하라.
        check:
          fn: lexical_overlap
          target: { min_overlap: 0.5, max_overlap: 0.75 }
      - value: fully
        prompt: 원문 문장을 그대로 발췌해 이어붙이는 방식으로 요약하라. 문장을 새로 쓰지 마라.
        check:
          fn: lexical_overlap
          target: { min_overlap: 0.75 }

  - name: topic
    type: freeform_keyword
    description: >-
      요약이 초점을 맞춰야 할 주제/키워드. 값이 비어 있으면 이 축은 적용하지
      않는다 (원문 전체를 다루는 일반 요약).
    empty_means_inactive: true
    prompt_template: '"{value}"라는 주제/측면에 초점을 맞춰 요약하라. 원문의 다른 부분은 생략해도 된다.'
    check:
      fn: keyword_presence
      target: {}
