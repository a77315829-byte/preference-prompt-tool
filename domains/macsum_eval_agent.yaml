# macsum_eval_agent 도메인 - agents/domain_onboarding.py 가 자동 생성함.
# 사람이 검토 후 커밋하는 걸 권장한다 - 안전하게 실행됐다는 것과 축이
# 올바르다는 것은 별개 문제다.

domain: macsum_eval_agent
task_description: >-
  아래 원문을 지침에 따라 처리하라.

checks_module: checks.macsum_eval_agent

axes:
  - name: conciseness
    type: enum
    description: The degree to which the output is brief and to the point versus detailed and elaborate.
    values:
      - value: concise
        prompt: 이 결과물을 'concise' 수준의 conciseness(으)로 만들어라.
        check:
          fn: check_conciseness
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: moderate
        prompt: 이 결과물을 'moderate' 수준의 conciseness(으)로 만들어라.
        check:
          fn: check_conciseness
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: detailed
        prompt: 이 결과물을 'detailed' 수준의 conciseness(으)로 만들어라.
        check:
          fn: check_conciseness
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
  - name: formality
    type: enum
    description: The level of formality in language, from casual or informal to formal and professional.
    values:
      - value: informal
        prompt: 이 결과물을 'informal' 수준의 formality(으)로 만들어라.
        check:
          fn: check_formality
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: neutral
        prompt: 이 결과물을 'neutral' 수준의 formality(으)로 만들어라.
        check:
          fn: check_formality
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: formal
        prompt: 이 결과물을 'formal' 수준의 formality(으)로 만들어라.
        check:
          fn: check_formality
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
  - name: sentence_complexity
    type: enum
    description: The complexity of sentence structures, from simple and short sentences to complex and compound sentences.
    values:
      - value: simple
        prompt: 이 결과물을 'simple' 수준의 sentence_complexity(으)로 만들어라.
        check:
          fn: check_sentence_complexity
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: moderate
        prompt: 이 결과물을 'moderate' 수준의 sentence_complexity(으)로 만들어라.
        check:
          fn: check_sentence_complexity
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: complex
        prompt: 이 결과물을 'complex' 수준의 sentence_complexity(으)로 만들어라.
        check:
          fn: check_sentence_complexity
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
  - name: focus_on_entities
    type: enum
    description: The extent to which the output emphasizes named entities (people, organizations, places) explicitly versus focusing on general information or events.
    values:
      - value: general
        prompt: 이 결과물을 'general' 수준의 focus_on_entities(으)로 만들어라.
        check:
          fn: check_focus_on_entities
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: mixed
        prompt: 이 결과물을 'mixed' 수준의 focus_on_entities(으)로 만들어라.
        check:
          fn: check_focus_on_entities
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: entity-focused
        prompt: 이 결과물을 'entity-focused' 수준의 focus_on_entities(으)로 만들어라.
        check:
          fn: check_focus_on_entities
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
