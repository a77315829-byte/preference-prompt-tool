# macsum_eval_agent 도메인 - agents/domain_onboarding.py 가 자동 생성함.
# 사람이 검토 후 커밋하는 걸 권장한다 - 안전하게 실행됐다는 것과 축이
# 올바르다는 것은 별개 문제다.

domain: macsum_eval_agent
task_description: >-
  아래 원문을 지침에 따라 처리하라.

checks_module: checks.macsum_eval_agent

axes:
  - name: conciseness
    type: enum
    description: The degree to which the output is brief and to the point versus detailed and elaborate.
    values:
      - value: concise
        prompt: 이 결과물을 'concise' 수준의 conciseness(으)로 만들어라.
        check:
          fn: check_conciseness
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: moderate
        prompt: 이 결과물을 'moderate' 수준의 conciseness(으)로 만들어라.
        check:
          fn: check_conciseness
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: detailed
        prompt: 이 결과물을 'detailed' 수준의 conciseness(으)로 만들어라.
        check:
          fn: check_conciseness
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
  - name: formality
    type: enum
    description: The level of formality in language, from casual or informal to formal and professional.
    values:
      - value: informal
        prompt: 이 결과물을 'informal' 수준의 formality(으)로 만들어라.
        check:
          fn: check_formality
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: neutral
        prompt: 이 결과물을 'neutral' 수준의 formality(으)로 만들어라.
        check:
          fn: check_formality
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: formal
        prompt: 이 결과물을 'formal' 수준의 formality(으)로 만들어라.
        check:
          fn: check_formality
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
  - name: sentence_complexity
    type: enum
    description: The complexity of sentence structures, from simple and short sentences to complex and compound sentences.
    values:
      - value: simple
        prompt: 이 결과물을 'simple' 수준의 sentence_complexity(으)로 만들어라.
        check:
          fn: check_sentence_complexity
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: moderate
        prompt: 이 결과물을 'moderate' 수준의 sentence_complexity(으)로 만들어라.
        check:
          fn: check_sentence_complexity
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: complex
        prompt: 이 결과물을 'complex' 수준의 sentence_complexity(으)로 만들어라.
        check:
          fn: check_sentence_complexity
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
  - name: focus_on_entities
    type: enum
    description: The extent to which the output emphasizes named entities (people, organizations, places) explicitly versus focusing on general information or events.
    values:
      - value: general
        prompt: 이 결과물을 'general' 수준의 focus_on_entities(으)로 만들어라.
        check:
          fn: check_focus_on_entities
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: mixed
        prompt: 이 결과물을 'mixed' 수준의 focus_on_entities(으)로 만들어라.
        check:
          fn: check_focus_on_entities
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음
      - value: entity-focused
        prompt: 이 결과물을 'entity-focused' 수준의 focus_on_entities(으)로 만들어라.
        check:
          fn: check_focus_on_entities
          target: {}  # 경계값은 check 함수 안에 이미 고정돼 있음

# 사용자에게 건네는 최종 프롬프트의 틀 (engine/generator.py 의
# build_final_prompt). 후보를 만들 때 쓰는 문구와는 따로 둔다.
final_prompt:
  role: 당신은 이 사용자의 취향에 맞춰 문서를 다듬는 편집 도우미다. 아래 선호는 사용자가 여러 결과물을 직접 비교하며 고른 결과에서 추정한 것이다.
  preference_heading: 이 사용자의 선호
  rules_heading: 항상 지킬 것
  output_heading: 출력 형식
  rules:
  - 원문의 사실과 주장을 바꾸거나 새로 덧붙이지 마라.
  - 숫자, 날짜, 이름, 담당자는 원문과 똑같이 옮겨라.
  - 원문의 언어로 결과를 써라.
  output: 다듬은 결과물만 출력하라. 무엇을 바꿨는지에 대한 설명은 붙이지 마라.
  axis_labels:
    conciseness: 간결함
    formality: 격식
    sentence_complexity: 문장 구조
    focus_on_entities: 강조점

# 최적화 평가용 예시 입력 (새로 쓴 가상의 내용). 최적화가 사용자 원문
# 하나에 맞춰 그 내용을 프롬프트에 박아 넣지 않도록, 후보를 고를 때
# 이 입력들로 채점한다.
example_sources:
- Our quarterly review meeting covered the new onboarding process, which has reduced setup time for new hires from five days to two. However, several managers noted that documentation is still scattered across three different tools, making it hard to find the latest version. The team agreed to consolidate everything into one wiki by the end of next month, with Dana owning the migration.
- The pilot program for remote equipment monitoring ran for eight weeks at two sites. Downtime dropped by roughly a quarter at the first site, but the second site saw little change because sensors were installed late. Before expanding, the operations group wants a full twelve-week run at both sites and a cost estimate for the network upgrades that the sensors require.
- Customer support response times improved this quarter, with the median first reply falling from nine hours to four. The improvement came mostly from a new triage rule that routes billing questions directly to the finance desk. Satisfaction scores rose slightly, but complaints about repeated transfers between teams remain the most common issue in survey comments.
