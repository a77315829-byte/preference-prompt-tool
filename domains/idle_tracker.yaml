# AWS 비용 현황의 개인화 보고 및 점검 안내
#
# 2026-09-30 과제 서술을 좁혔다 (외부 검토 반영, 대상 사용자는 아직
# 팀이 확정하지 않은 가설임을 전제로 함). 원래 "유휴 리소스를 찾아라"는
# 이 도구가 실제로 하지 않는 일까지 약속했다 - 지금 조회는 Cost
# Explorer의 서비스별 비용 합계이지, 특정 EIP·스냅샷이 유휴 상태인지
# 확정하지 않는다(데모의 예시 리소스는 미리 정해둔 것이다). 축(엔진이
# 개인화하는 부분)과 필수조건(항상 지켜야 하는 부분)도 나눴다 -
# detail_level·focus는 축, 금액·리소스ID의 정확성은
# checks/idle_tracker.py의 total_cost_accuracy·no_fabrication이
# 별도로 검증한다(취향이 아니라서 축 채점에 안 넣는다).
domain: idle_tracker

task_description: >-
  AWS 비용 조회 결과를 바탕으로, 사용자가 이해하기 좋은 방식으로
  현황을 보고하고 확인할 점을 안내하라. 조회 데이터에 있는 금액과
  리소스만 언급하고, 데이터에 없는 값은 지어내지 마라.

checks_module: checks.idle_tracker

axes:
  - name: detail_level
    type: enum
    description: 비용 누수 결과를 얼마나 자세하게 보여줄지
    values:
      - value: summary
        prompt: >-
          핵심 비용과 가장 중요한 조치만 짧게 요약하라.
        check:
          fn: detail_level
          target:
            min_actions: 1
            max_lines: 8
      - value: detailed
        prompt: >-
          비용, 리소스 ID, 발견 근거와 AWS 콘솔에서 따라 할 해결 방법을
          단계별로 자세하게 설명하라.
        check:
          fn: detail_level
          target:
            min_actions: 2
            min_lines: 10

  - name: focus
    type: enum
    description: 결과에서 무엇을 먼저 강조할지
    values:
      - value: cost
        prompt: >-
          월간 예상 낭비 금액과 비용이 큰 항목을 먼저 강조하고,
          리소스 정보는 근거로 덧붙여라.
        check:
          fn: focus
          target:
            min_cost_signals: 2
            min_resource_signals: 1
      - value: resource
        prompt: >-
          리소스 ID, 리소스 종류와 위치를 먼저 강조하고,
          각 리소스가 만드는 비용은 함께 표시하라.
        check:
          fn: focus
          target:
            min_cost_signals: 1
            min_resource_signals: 2

# 사용자에게 건네는 최종 프롬프트의 틀 (engine/generator.py 의
# build_final_prompt). 후보를 만들 때 쓰는 문구와는 따로 둔다.
final_prompt:
  role: 당신은 이 사용자의 AWS 비용 데이터를 점검해 낭비를 찾아 주는 클라우드 비용 도우미다. 아래 선호는 사용자가 여러 점검 결과를 직접 비교하며 고른 결과에서 추정한 것이다.
  preference_heading: 이 사용자의 선호
  # 팀 모드(여러 사람의 선택을 합친 프롬프트)에서 쓰는 문구.
  team_role: 당신은 이 팀의 AWS 비용 데이터를 점검해 낭비를 찾아 주는 클라우드 비용 도우미다. 아래 선호는 팀원들이 각자 여러 점검 결과를 직접 비교하며 고른 결과를 합쳐 추정한 것이다.
  team_preference_heading: 이 팀의 선호
  rules_heading: 항상 지킬 것
  output_heading: 출력 형식
  rules:
  - 주어진 데이터에 근거한 항목만 짚어라. 데이터에 없는 리소스나 금액을 지어내지 마라.
  - 삭제·중지처럼 되돌리기 어려운 조치는 먼저 확인할 것(스냅샷, 의존 관계)을 함께 적어라.
  - 절감액은 데이터로 계산할 수 있을 때만 제시하고, 추정치면 추정이라고 밝혀라.
  output: 점검 결과만 한국어로 출력하라. 항목마다 확인할 리소스와 해결 방법을 함께 적어라.
  axis_labels:
    detail_level: 자세한 정도
    focus: 먼저 강조할 것

# 최적화 평가용 예시 입력 (새로 쓴 가상의 내용). 최적화가 사용자 원문
# 하나에 맞춰 그 내용을 프롬프트에 박아 넣지 않도록, 후보를 고를 때
# 이 입력들로 채점한다.
example_sources:
- Monthly AWS bill rose 22 percent. EC2 is the largest line item, followed by EBS volumes and an RDS instance used for a staging database. Two load balancers show almost no traffic.
- Cost Explorer shows steady S3 growth over six months, several unattached EBS volumes in us-east-1, and a NAT gateway charging for data processing in a VPC with no running instances.
- A development account spends about 900 dollars a month. Most of it is three t3.large instances that run around the clock, plus snapshots older than a year and an idle Elastic IP.

# 최종 프롬프트의 영어판 (화면 기본값). 보고서는 원래대로 한국어로 쓰게 한다.
final_prompt_translations:
  en:
    role: "You are a cloud cost assistant who reviews this user's AWS cost data and finds waste. The preferences below were inferred from review results the user picked while comparing several options."
    team_role: "You are a cloud cost assistant who reviews this team's AWS cost data and finds waste. The preferences below were inferred by combining the review results each team member picked while comparing several options."
    task: "Based on the AWS cost query results, report the current situation in a way that is easy to understand and point out what to check. Mention only amounts and resources that appear in the data, and do not invent values that are not in it."
    preference_heading: "This user's preferences"
    team_preference_heading: "This team's preferences"
    rules_heading: "Always"
    rules:
      - "Only point out items supported by the given data. Do not invent resources or amounts that are not in it."
      - "For hard-to-undo actions such as deleting or stopping, also list what to check first (snapshots, dependencies)."
      - "Give savings only when they can be calculated from the data, and say so when a figure is an estimate."
    output_heading: "Output format"
    output: "Output only the review results, in Korean. For each item, include the resource to check and how to resolve it."
    axis_labels:
      detail_level: "Level of detail"
      focus: "What to lead with"
    instructions:
      detail_level:
        summary: "Briefly summarize only the key costs and the most important actions."
        detailed: "Explain the costs, resource IDs, the evidence found, and step-by-step fixes to follow in the AWS console in detail."
      focus:
        cost: "Lead with the estimated monthly waste and the most expensive items, and add resource details as supporting evidence."
        resource: "Lead with resource IDs, resource types, and locations, and show the cost each resource generates alongside."
