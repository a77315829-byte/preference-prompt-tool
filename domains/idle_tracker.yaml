# AWS 비용 현황의 개인화 보고 및 점검 안내
#
# 2026-09-30 과제 서술을 좁혔다 (외부 검토 반영, 대상 사용자는 아직
# 팀이 확정하지 않은 가설임을 전제로 함). 원래 "유휴 리소스를 찾아라"는
# 이 도구가 실제로 하지 않는 일까지 약속했다 - 지금 조회는 Cost
# Explorer의 서비스별 비용 합계이지, 특정 EIP·스냅샷이 유휴 상태인지
# 확정하지 않는다(데모의 예시 리소스는 미리 정해둔 것이다). 축(엔진이
# 개인화하는 부분)과 필수조건(항상 지켜야 하는 부분)도 나눴다 -
# detail_level·focus는 축, 금액·리소스ID의 정확성은
# checks/idle_tracker.py의 total_cost_accuracy·no_fabrication이
# 별도로 검증한다(취향이 아니라서 축 채점에 안 넣는다).
domain: idle_tracker

task_description: >-
  AWS 비용 조회 결과를 바탕으로, 사용자가 이해하기 좋은 방식으로
  현황을 보고하고 확인할 점을 안내하라. 조회 데이터에 있는 금액과
  리소스만 언급하고, 데이터에 없는 값은 지어내지 마라.

checks_module: checks.idle_tracker

axes:
  - name: detail_level
    type: enum
    description: 비용 누수 결과를 얼마나 자세하게 보여줄지
    values:
      - value: summary
        prompt: >-
          핵심 비용과 가장 중요한 조치만 짧게 요약하라.
        check:
          fn: detail_level
          target:
            min_actions: 1
            max_lines: 8
      - value: detailed
        prompt: >-
          비용, 리소스 ID, 발견 근거와 AWS 콘솔에서 따라 할 해결 방법을
          단계별로 자세하게 설명하라.
        check:
          fn: detail_level
          target:
            min_actions: 2
            min_lines: 10

  - name: focus
    type: enum
    description: 결과에서 무엇을 먼저 강조할지
    values:
      - value: cost
        prompt: >-
          월간 예상 낭비 금액과 비용이 큰 항목을 먼저 강조하고,
          리소스 정보는 근거로 덧붙여라.
        check:
          fn: focus
          target:
            min_cost_signals: 2
            min_resource_signals: 1
      - value: resource
        prompt: >-
          리소스 ID, 리소스 종류와 위치를 먼저 강조하고,
          각 리소스가 만드는 비용은 함께 표시하라.
        check:
          fn: focus
          target:
            min_cost_signals: 1
            min_resource_signals: 2
