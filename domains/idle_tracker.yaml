# AWS 비용에서 유휴 리소스를 찾는 개인화 도메인

domain: idle_tracker

task_description: >-
  AWS 비용 데이터를 바탕으로 사용자가 놓치기 쉬운 유휴 리소스와
  비용 누수를 찾고, 확인할 리소스와 해결 방법을 안내하라.

checks_module: checks.idle_tracker

axes:
  - name: detail_level
    type: enum
    description: 비용 누수 결과를 얼마나 자세하게 보여줄지
    values:
      - value: summary
        prompt: >-
          핵심 비용과 가장 중요한 조치만 짧게 요약하라.
        check:
          fn: detail_level
          target:
            min_actions: 1
            max_lines: 8
      - value: detailed
        prompt: >-
          비용, 리소스 ID, 발견 근거와 AWS 콘솔에서 따라 할 해결 방법을
          단계별로 자세하게 설명하라.
        check:
          fn: detail_level
          target:
            min_actions: 2
            min_lines: 10

  - name: focus
    type: enum
    description: 결과에서 무엇을 먼저 강조할지
    values:
      - value: cost
        prompt: >-
          월간 예상 낭비 금액과 비용이 큰 항목을 먼저 강조하고,
          리소스 정보는 근거로 덧붙여라.
        check:
          fn: focus
          target:
            min_cost_signals: 2
            min_resource_signals: 1
      - value: resource
        prompt: >-
          리소스 ID, 리소스 종류와 위치를 먼저 강조하고,
          각 리소스가 만드는 비용은 함께 표시하라.
        check:
          fn: focus
          target:
            min_cost_signals: 1
            min_resource_signals: 2
