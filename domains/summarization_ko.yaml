# 도메인: 문서 요약 (한국어) - 언어 이식성 검증용 (CLAUDE.md v2, 우선순위 2).
#
# domains/summarization.yaml(영어)과 축 구성은 동일하되(length, extractiveness,
# topic), 한국어는 MACSum 같은 사람 주석 답안지가 없어 정량 복원율은 산출하지
# 않는다 - 파이프라인 완주와 축별 검사 함수의 스팟 체크용이다.
#
# 한국어 특유의 문제: 조사가 붙어 "정부는/정부가/정부의"가 표면형으로는 전부
# 다른 토큰이 된다. checks/summarization_ko.py는 Kiwi로 형태소(어간)만 뽑아
# 비교해 이 문제를 피한다 - checks/summarization.py의 순수 정규식 방식과
# 다르다.

domain: summarization_ko
task_description: >-
  아래 원문을 지침에 따라 요약하라. 요약은 반드시 한국어로 작성하라.

checks_module: checks.summarization_ko

axes:
  - name: length
    type: enum
    description: 요약 길이
    values:
      - value: short
        prompt: 2문장 이내로 아주 짧게 요약하라.
        check:
          fn: sentence_count
          target: { max_sentences: 2 }
      - value: normal
        prompt: 3~4문장 정도의 분량으로 요약하라.
        check:
          fn: sentence_count
          target: { min_sentences: 3, max_sentences: 4 }
      - value: long
        prompt: 5문장 이상으로 상세하게 요약하라.
        check:
          fn: sentence_count
          target: { min_sentences: 5 }

  - name: extractiveness
    type: enum
    description: 원문 표현을 그대로 가져오는 정도 (형태소 단위 연속 2어절 겹침 비율)
    values:
      - value: normal
        prompt: 대부분은 새로운 표현으로 바꿔 쓰되, 필요하면 원문 표현을 일부 인용해도 좋다.
        check:
          fn: lexical_overlap
          target: { max_overlap: 0.5 }
      - value: high
        prompt: 가능한 한 원문의 단어와 구절을 그대로 사용해 요약하라.
        check:
          fn: lexical_overlap
          target: { min_overlap: 0.5, max_overlap: 0.75 }
      - value: fully
        prompt: 원문 문장을 그대로 발췌해 이어붙이는 방식으로 요약하라. 문장을 새로 쓰지 마라.
        check:
          fn: lexical_overlap
          target: { min_overlap: 0.75 }

  - name: topic
    type: freeform_keyword
    description: >-
      요약이 초점을 맞춰야 할 주제/키워드. 값이 비어 있으면 이 축은 적용하지
      않는다 (원문 전체를 다루는 일반 요약).
    empty_means_inactive: true
    prompt_template: '"{value}"라는 주제/측면에 초점을 맞춰 요약하라. 원문의 다른 부분은 생략해도 된다.'
    check:
      fn: keyword_presence
      target: {}

# 사용자에게 건네는 최종 프롬프트의 틀 (engine/generator.py 의
# build_final_prompt). 후보를 만들 때 쓰는 문구와는 따로 둔다.
final_prompt:
  role: 당신은 이 사용자의 취향에 맞춰 한국어 글을 요약하는 요약 도우미다. 아래 선호는 사용자가 여러 요약을 직접 비교하며 고른 결과에서 추정한 것이다.
  preference_heading: 이 사용자의 선호
  # 팀 모드(여러 사람의 선택을 합친 프롬프트)에서 쓰는 문구.
  team_role: 당신은 이 팀의 취향에 맞춰 한국어 글을 요약하는 요약 도우미다. 아래 선호는 팀원들이 각자 여러 요약을 직접 비교하며 고른 결과를 합쳐 추정한 것이다.
  team_preference_heading: 이 팀의 선호
  rules_heading: 항상 지킬 것
  output_heading: 출력 형식
  rules:
  - 위의 선호(분량, 원문 표현을 살리는 정도)를 가장 먼저 지켜라. 아래 규칙은 그 안에서 적용하라.
  - 원문에 없는 사실, 추측, 의견을 덧붙이지 마라.
  - 숫자, 날짜, 고유명사를 틀리게 옮기지 마라.
  - 확정된 사실과 검토 중이거나 불확실한 내용을 구분해 적어라.
  output: 요약문만 한국어로 출력하라. 머리말, 제목, 설명, 맺음말을 붙이지 마라.
  axis_labels:
    length: 분량
    extractiveness: 원문 표현을 살리는 정도
    topic: 초점

# 최적화 평가용 예시 입력 (새로 쓴 가상의 내용). 최적화가 사용자 원문
# 하나에 맞춰 그 내용을 프롬프트에 박아 넣지 않도록, 후보를 고를 때
# 이 입력들로 채점한다.
example_sources:
- 시 교통공사는 다음 달부터 심야 버스 노선 네 개의 운행 시간을 새벽 2시까지 늘린다고 밝혔다. 공사에 따르면 밤 10시 이후 이용객은 지난해보다 18퍼센트 늘었고, 병원과 물류센터 교대 근무자가 대부분을 차지한다. 연간 추가 비용은 약 23억 원으로 도 보조금으로 충당하지만 보조금은 2년 뒤 끝난다. 일부 이사는 그 뒤의 재원 대책을 물었고, 공사는 여름까지 장기 계획을 내놓기로 했다.
- 한 중소 바이오 기업이 희귀 간 질환 치료 후보 물질의 중기 임상에서 주요 목표를 달성했다고 발표했다. 환자 120명을 대상으로 한 시험에서 투약군의 간 손상 지표는 6개월 뒤 40퍼센트 줄었고, 위약군은 8퍼센트 줄었다. 회사는 올해 안에 규제 당국과 대규모 임상을 협의할 계획이다. 발표 직후 주가가 크게 올랐지만, 전문가들은 중기 임상 결과가 대규모 시험에서 유지되지 않는 경우가 많다고 지적했다.
- 구청은 하천변 공원의 보행 다리에서 균열이 발견돼 공원을 최소 3주간 폐쇄한다고 밝혔다. 이 다리는 1978년에 지어졌고 2년 전 정기 점검은 통과했다. 기술진은 보수로 충분한지 아니면 새로 지어야 하는지 판단할 예정이며, 재건축이 결정되면 개방은 내년 봄으로 미뤄질 수 있다. 인근 상인들은 주말 방문객이 벌써 줄었다고 호소했고, 구청은 다른 입구를 안내하는 임시 표지판을 설치하기로 했다.

# 최종 프롬프트의 영어판 (화면 기본값). 지시문은 영어지만 요약은 한국어로 쓰게 한다 -
# 지시문 언어와 출력 언어가 다르면 출력이 섞인 적이 있어(8주차) 두 번 못 박는다.
final_prompt_translations:
  en:
    role: "You are a summarization assistant who summarizes Korean text to match this user's preferences. The preferences below were inferred from summaries the user picked while comparing several options."
    team_role: "You are a summarization assistant who summarizes Korean text to match this team's preferences. The preferences below were inferred by combining the summaries each team member picked while comparing several options."
    task: "Summarize the source text below according to these instructions. Always write the summary in Korean, even though these instructions are in English."
    preference_heading: "This user's preferences"
    team_preference_heading: "This team's preferences"
    rules_heading: "Always"
    rules:
      - "Follow the preferences above (length, use of source wording) first; apply the rules below within them."
      - "Do not add facts, guesses, or opinions that are not in the source."
      - "Do not misstate numbers, dates, or proper nouns."
      - "Keep confirmed facts separate from things that are under review or uncertain."
    output_heading: "Output format"
    output: "Output only the summary, in Korean. No preamble, title, explanation, or closing."
    axis_labels:
      length: "Length"
      extractiveness: "Use of source wording"
      topic: "Focus"
    instructions:
      length:
        short: "Keep it very short: two sentences or fewer."
        normal: "Write about three to four sentences."
        long: "Write five or more sentences, in detail."
      extractiveness:
        normal: "Mostly rephrase in your own words; quote the source wording only where it helps."
        high: "Reuse the source's words and phrases as much as possible."
        fully: "Build the summary from sentences extracted verbatim from the source. Do not write new sentences."
    freeform_templates:
      topic: 'Focus the summary on "{value}". You may leave out other parts of the source.'
