version: 2
en:
  extraction_rule: For complete verbatim extraction, use distinct complete source sentences only. Never repeat a sentence, split it, or invent new text to meet a minimum sentence count.
  shorten: The user explicitly allowed a smaller sentence budget because the source has too few distinct complete sentences for the original minimum. Use the resolved length above, retain complete verbatim extraction, and preserve every required passage. Do not repeat sentences to fill the budget.
ko:
  extraction_rule: 완전 발췌에서는 서로 다른 원문의 완전한 문장만 사용하라. 최소 문장 수를 채우려고 같은 문장을 반복하거나 문장을 쪼개거나 없는 내용을 만들지 마라.
  shorten: 원문에 서로 다른 완전한 문장이 부족해 사용자가 분량 축소를 명시적으로 허용했다. 위에 조정된 분량을 적용하고 완전 발췌와 고른 모든 문장의 보존을 유지하라. 문장 수를 채우려고 문장을 반복하지 마라.
