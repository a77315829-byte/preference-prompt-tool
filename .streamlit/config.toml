# 배포와 로컬이 같은 색을 쓰게 고정한다. 안 넣으면 Streamlit 기본 테마를
# 따라가고, 나중에 기본값이 바뀌면 제출용 스크린샷과 실제 화면이 달라진다.
#
# 표준 키만 쓴다. 이 버전에서 확실히 지원되는 것들이고, 없는 키를 넣으면
# 기동 시 경고가 나거나 최악의 경우 배포가 깨질 수 있다. 나머지 시각
# 요소는 app.py 의 CSS 로 처리한다.
#
# 이 파일은 Streamlit 이 기동 시점에만 읽는다. 고친 뒤에는 프로세스를
# 새로 띄워야 반영되므로 scripts/bump_build_marker.py 의 감시 대상에
# 들어가 있다.
# 값은 theme.py 의 TOKENS 와 같아야 한다. 어긋나면 Streamlit 이 그리는
# 위젯과 우리가 그리는 HTML 의 색이 미묘하게 달라진다.
[theme]
base = "dark"
primaryColor = "#D7FF3E"
backgroundColor = "#0B0C0E"
secondaryBackgroundColor = "#141619"
textColor = "#E8EAED"
font = "sans serif"
