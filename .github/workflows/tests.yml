# push·PR마다 API 없이 도는 테스트를 돌린다.
#
# 실제 모델을 부르는 테스트(@pytest.mark.api)는 뺀다. 비용이 들고 키를
# CI에 넣지 않는다. MACSum 데이터가 필요한 테스트는 conftest.py가
# 이유를 표시하며 건너뛴다 - data/ 는 커밋하지 않는다.
#
# 로컬에서 초록인데 여기서 빨갛다면 대개 커밋 안 된 파일(cache/, data/)에
# 기대는 테스트다.
name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests without API
        run: python -m pytest -m "not api" -q
