# Retired Streamlit checks are disabled. Run this explicitly against the React service.
name: Smoke test deployed React app (manual)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'React 서비스의 HTTPS 주소'
        required: true
        type: string

# 수동 검사가 겹치면 이전 것을 취소한다.
concurrency:
  group: smoke-live
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check deployed app
        run: python -m scripts.smoke_hosted --url "$APP_URL"
        env:
          APP_URL: ${{ inputs.app_url }}
